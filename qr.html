<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LocalGo | Everything at Your Doorstep</title>
    
    <!-- Google Fonts: Poppins for a sleek, modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for standard, recognizable icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        neon: '#39FF14',
                        brand: '#22c55e',
                        matte: '#000000',
                        panel: '#0f0f0f' // Slightly lighter than black for depth
                    },
                    animation: {
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.6s ease-out forwards'
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 15px rgba(57,255,20,0.2)' },
                            '50%': { opacity: 0.9, boxShadow: '0 0 25px rgba(57,255,20,0.5)' },
                        },
                        'fadeIn': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        'slideUp': {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Hide scrollbar for a cleaner app-like feel */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Subtle background glow effect centered behind the content */
        .bg-glow {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 150vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 10%, rgba(34, 197, 94, 0.12) 0%, rgba(0,0,0,0) 50%);
            z-index: -1;
            pointer-events: none;
            max-width: 600px;
        }
    </style>
</head>

<body class="min-h-screen relative flex flex-col items-center py-12 px-5 sm:px-6 overflow-x-hidden selection:bg-brand selection:text-white">
    
    <!-- Ambient Glow -->
    <div class="bg-glow"></div>

    <!-- Main Content Container (Mobile-optimized Linktree style) -->
    <main class="w-full max-w-[380px] mx-auto flex flex-col items-center z-10 relative flex-grow">

        <!-- Header Section -->
        <header class="flex flex-col items-center w-full mb-10 animate-fade-in">
            <!-- Logo Container -->
            <div class="w-32 h-32 sm:w-36 sm:h-36 mb-6 relative">
                <!-- Outer glow -->
                <div class="absolute inset-0 bg-neon blur-[25px] opacity-20 rounded-[2rem]"></div>
                <!-- Logo Image -->
                <img src="image_5.png" alt="LocalGo Logo" class="w-full h-full object-cover rounded-[1.8rem] relative z-10 shadow-[0_8px_30px_rgb(0,0,0,0.5)] border border-white/5">
            </div>
            
            <!-- Brand Name & Tagline -->
            <h1 class="text-3xl font-bold text-white mb-2 text-center tracking-wide">
                Local<span class="text-neon">Go</span>
            </h1>
            <p class="text-gray-400 text-sm font-medium text-center uppercase tracking-[0.2em]">
                Everything at Your Doorstep.
            </p>
        </header>

        <!-- App Download Links Section -->
        <section class="w-full flex flex-col gap-4 mb-12 animate-slide-up" style="animation-delay: 0.1s;">
            
            <!-- Google Play Button (Primary/Active) -->
            <a href="#" class="group relative w-full flex items-center justify-center gap-4 py-4 px-6 bg-panel border border-brand/40 rounded-2xl text-white font-semibold transition-all duration-300 hover:bg-[#151515] hover:border-neon hover:shadow-[0_0_20px_rgba(57,255,20,0.3)] hover:-translate-y-1 overflow-hidden" aria-label="Get it on Google Play">
                <div class="text-3xl relative z-10 text-neon group-hover:scale-110 transition-transform duration-300">
                    <i class="fab fa-google-play"></i>
                </div>
                <div class="flex flex-col items-start relative z-10 text-left flex-grow">
                    <span class="text-[0.65rem] text-gray-400 uppercase tracking-wider leading-none mb-1 group-hover:text-gray-300">Download for</span>
                    <span class="text-lg leading-none tracking-wide font-bold">Android</span>
                </div>
                <div class="text-gray-500 group-hover:text-neon transition-colors duration-300">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <!-- App Store Button (Coming Soon / Disabled) -->
            <div class="relative w-full flex items-center justify-center gap-4 py-4 px-6 bg-panel/50 border border-gray-800 rounded-2xl text-gray-500 opacity-70 cursor-not-allowed overflow-hidden" aria-label="iOS App Coming Soon">
                <!-- Diagonal stripes overlay to indicate disabled state subtly -->
                <div class="absolute inset-0 opacity-[0.03]" style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, #ffffff 10px, #ffffff 20px);"></div>
                
                <div class="text-3xl relative z-10">
                    <i class="fab fa-apple"></i>
                </div>
                <div class="flex flex-col items-start relative z-10 text-left flex-grow">
                    <span class="text-[0.65rem] text-gray-500 uppercase tracking-wider leading-none mb-1">Download for</span>
                    <span class="text-lg leading-none tracking-wide font-semibold text-gray-400">iOS</span>
                </div>
                
                <!-- Coming Soon Badge -->
                <div class="relative z-10">
                    <span class="text-[0.65rem] font-bold uppercase tracking-wider bg-gray-800 text-gray-300 px-3 py-1.5 rounded-full border border-gray-700">
                        Coming Soon
                    </span>
                </div>
            </div>
            
        </section>

        <!-- Social Media Links -->
        <section class="w-full flex flex-col items-center animate-slide-up" style="animation-delay: 0.2s;">
            <div class="flex items-center justify-center w-full mb-6 relative">
                <div class="h-px bg-gradient-to-r from-transparent via-gray-700 to-transparent flex-grow"></div>
                <span class="px-4 text-[0.65rem] font-semibold text-gray-500 uppercase tracking-[0.15em] bg-black">Connect With Us</span>
                <div class="h-px bg-gradient-to-r from-transparent via-gray-700 to-transparent flex-grow"></div>
            </div>
            
            <div class="flex justify-center gap-4 w-full flex-wrap">
                <!-- WhatsApp -->
                <a href="#" class="w-12 h-12 flex items-center justify-center rounded-full bg-panel border border-gray-800 text-gray-400 hover:text-white hover:bg-[#25D366]/20 hover:border-[#25D366] hover:shadow-[0_0_15px_rgba(37,211,102,0.4)] transition-all duration-300 hover:-translate-y-1" aria-label="WhatsApp">
                    <i class="fab fa-whatsapp text-xl"></i>
                </a>
                <!-- Instagram -->
                <a href="#" class="w-12 h-12 flex items-center justify-center rounded-full bg-panel border border-gray-800 text-gray-400 hover:text-white hover:bg-[#E1306C]/20 hover:border-[#E1306C] hover:shadow-[0_0_15px_rgba(225,48,108,0.4)] transition-all duration-300 hover:-translate-y-1" aria-label="Instagram">
                    <i class="fab fa-instagram text-xl"></i>
                </a>
                <!-- Facebook -->
                <a href="#" class="w-12 h-12 flex items-center justify-center rounded-full bg-panel border border-gray-800 text-gray-400 hover:text-white hover:bg-[#1877F2]/20 hover:border-[#1877F2] hover:shadow-[0_0_15px_rgba(24,119,242,0.4)] transition-all duration-300 hover:-translate-y-1" aria-label="Facebook">
                    <i class="fab fa-facebook-f text-xl"></i>
                </a>
                <!-- Twitter / X -->
                <a href="#" class="w-12 h-12 flex items-center justify-center rounded-full bg-panel border border-gray-800 text-gray-400 hover:text-white hover:bg-gray-600/20 hover:border-gray-400 hover:shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all duration-300 hover:-translate-y-1" aria-label="X (Twitter)">
                    <i class="fa-brands fa-x-twitter text-xl"></i>
                </a>
                <!-- LinkedIn -->
                <a href="#" class="w-12 h-12 flex items-center justify-center rounded-full bg-panel border border-gray-800 text-gray-400 hover:text-white hover:bg-[#0A66C2]/20 hover:border-[#0A66C2] hover:shadow-[0_0_15px_rgba(10,102,194,0.4)] transition-all duration-300 hover:-translate-y-1" aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in text-xl"></i>
                </a>
                <!-- Website -->
                <a href="https://localgo.co.in" target="_blank" rel="noopener noreferrer" class="w-12 h-12 flex items-center justify-center rounded-full bg-panel border border-gray-800 text-gray-400 hover:text-white hover:bg-brand/20 hover:border-brand hover:shadow-[0_0_15px_rgba(34,197,94,0.4)] transition-all duration-300 hover:-translate-y-1" aria-label="Website">
                    <i class="fas fa-globe text-xl"></i>
                </a>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="w-full mt-auto pt-10 pb-2 text-center animate-fade-in" style="animation-delay: 0.3s;">
        <p class="text-gray-600 text-[0.7rem] font-medium tracking-wide">
            &copy; <script>document.write(new Date().getFullYear())</script> LocalGo.co.in. All rights reserved.
        </p>
    </footer>

</body>
</html>
